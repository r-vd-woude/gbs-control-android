name: Android app

"on":
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Android Gradle Plugin uses jlink, so this must be a full JDK rather than a JRE.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gbs-control-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish tagged prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: gbs-control-debug-${{ github.sha }}
          path: artifacts

      - name: Name release files and create checksum
        run: |
          mkdir -p release
          output="release/GBS-Control-Android-${GITHUB_REF_NAME}-debug.apk"
          mv artifacts/app-debug.apk "$output"
          cd release
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          name: GBS-Control Android ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            release/GBS-Control-Android-${{ github.ref_name }}-debug.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
